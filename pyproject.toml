[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atcgu-study"
version = "0.1.0"
description = "Reproducible neutral nucleotide thermochemistry and primary Figure 1"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<3", "matplotlib>=3.9,<4", "PyYAML>=6,<7"]

[project.optional-dependencies]
structures = ["rdkit>=2025.9,<2026"]
dev = ["pytest>=8.4,<9", "jsonschema>=4.23,<5", "nbmake>=1.5,<2"]
notebooks = ["jupyterlab>=4,<5"]

[project.scripts]
atcgu = "atcgu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
