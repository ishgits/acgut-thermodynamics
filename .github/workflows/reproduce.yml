name: Study checks
on: [push, pull_request, workflow_dispatch]
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r environments/development.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest
      - run: python -m pytest --nbmake notebooks/
        env:
          MPLBACKEND: Agg
      - run: acgut validate --out outputs/ci-records
      - run: acgut audit --out outputs/ci-arithmetic
      - run: acgut reproduce --out outputs/ci-reproduction
        env:
          MPLBACKEND: Agg
      - run: acgut reproduce --no-figures --out outputs/ci-numerical
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproduction-and-audit
          path: outputs/
